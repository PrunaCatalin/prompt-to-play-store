<svg viewBox="0 0 760 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decision tree: if a task needs the whole repository in context it goes to the cloud model; if the data is sensitive, or the work is high volume and error tolerant, it goes to the local model; everything else goes to the cloud.">
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
    <rect x="300" y="12" width="160" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="380" y="38" text-anchor="middle" font-weight="700" fill="#0f172a">Task</text>

    <rect x="246" y="88" width="268" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="380" y="110" text-anchor="middle" font-weight="700" fill="#0f172a">Needs the whole repo</text>
    <text x="380" y="128" text-anchor="middle" font-size="11" fill="#475569">in context?</text>

    <rect x="246" y="182" width="268" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="380" y="204" text-anchor="middle" font-weight="700" fill="#0f172a">Sensitive data?</text>
    <text x="380" y="222" text-anchor="middle" font-size="11" fill="#475569">logs · screenshots · records</text>

    <rect x="246" y="276" width="268" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="380" y="298" text-anchor="middle" font-weight="700" fill="#0f172a">High volume,</text>
    <text x="380" y="316" text-anchor="middle" font-size="11" fill="#475569">tolerant to small errors?</text>

    <rect x="580" y="100" width="160" height="50" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="660" y="122" text-anchor="middle" font-weight="700" fill="#0f172a">Cloud model</text>
    <text x="660" y="140" text-anchor="middle" font-size="11" fill="#475569">judgement</text>

    <rect x="26" y="226" width="172" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="112" y="248" text-anchor="middle" font-weight="700" fill="#0f172a">Local 27B</text>
    <text x="112" y="266" text-anchor="middle" font-size="11" fill="#475569">volume</text>

    <rect x="580" y="302" width="160" height="42" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="660" y="328" text-anchor="middle" font-weight="700" fill="#0f172a">Cloud model</text>

    <line x1="380" y1="56" x2="380" y2="84" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ra)"/>
    <line x1="514" y1="115" x2="574" y2="120" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ra)"/>
    <text x="540" y="108" font-size="10.5" text-anchor="middle" font-weight="700" fill="#059669">yes</text>
    <line x1="380" y1="144" x2="380" y2="178" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ra)"/>
    <text x="392" y="166" font-size="10.5" font-weight="700" fill="#dc2626">no</text>
    <line x1="244" y1="212" x2="204" y2="242" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ra)"/>
    <text x="214" y="206" font-size="10.5" font-weight="700" fill="#059669">yes</text>
    <line x1="380" y1="238" x2="380" y2="272" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ra)"/>
    <text x="392" y="260" font-size="10.5" font-weight="700" fill="#dc2626">no</text>
    <line x1="244" y1="304" x2="204" y2="276" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ra)"/>
    <text x="214" y="302" font-size="10.5" font-weight="700" fill="#059669">yes</text>
    <line x1="514" y1="308" x2="574" y2="318" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ra)"/>
    <text x="540" y="300" font-size="10.5" text-anchor="middle" font-weight="700" fill="#dc2626">no</text>
  </g>
</svg>
