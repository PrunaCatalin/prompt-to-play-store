<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline: a push to a release branch installs dependencies, runs a typecheck and lint gate that can stop the build, prebuilds the native project, signs and bundles for phone ABIs only, uploads to Play internal testing, then shreds the signing key.">
  <defs>
    <marker id="ca" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="cf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">
    <rect x="16" y="88" width="122" height="52" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="77" y="110" text-anchor="middle" font-weight="700" fill="#0f172a">push</text>
    <text x="77" y="128" text-anchor="middle" font-size="11" fill="#475569">release/**</text>

    <rect x="166" y="88" width="122" height="52" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="227" y="110" text-anchor="middle" font-weight="700" fill="#0f172a">install</text>
    <text x="227" y="128" text-anchor="middle" font-size="11" fill="#475569">npm ci</text>

    <rect x="316" y="88" width="122" height="52" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="377" y="110" text-anchor="middle" font-weight="700" fill="#0f172a">quality gate</text>
    <text x="377" y="128" text-anchor="middle" font-size="11" fill="#475569">tsc · eslint</text>

    <rect x="316" y="196" width="122" height="44" rx="20" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="377" y="223" text-anchor="middle" font-weight="700" fill="#0f172a">build stops</text>

    <rect x="466" y="88" width="126" height="52" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="529" y="110" text-anchor="middle" font-weight="700" fill="#0f172a">prebuild</text>
    <text x="529" y="128" text-anchor="middle" font-size="11" fill="#475569">--clean</text>

    <rect x="620" y="88" width="126" height="52" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="683" y="110" text-anchor="middle" font-weight="700" fill="#0f172a">sign + bundle</text>
    <text x="683" y="128" text-anchor="middle" font-size="11" fill="#475569">arm64 only</text>

    <rect x="774" y="88" width="112" height="52" rx="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="830" y="110" text-anchor="middle" font-weight="700" fill="#0f172a">Play</text>
    <text x="830" y="128" text-anchor="middle" font-size="11" fill="#475569">internal</text>

    <rect x="620" y="192" width="126" height="50" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="683" y="214" text-anchor="middle" font-weight="700" fill="#0f172a">shred key</text>
    <text x="683" y="232" text-anchor="middle" font-size="11" fill="#475569">always()</text>

    <line x1="138" y1="114" x2="160" y2="114" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ca)"/>
    <line x1="288" y1="114" x2="310" y2="114" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ca)"/>
    <line x1="438" y1="114" x2="460" y2="114" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ca)"/>
    <line x1="592" y1="114" x2="614" y2="114" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ca)"/>
    <line x1="746" y1="114" x2="768" y2="114" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ca)"/>
    <line x1="683" y1="140" x2="683" y2="186" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ca)"/>
    <line x1="377" y1="142" x2="377" y2="190" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#cf)"/>
  </g>
</svg>
