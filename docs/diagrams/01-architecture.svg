<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-label="Three-tier architecture: local machine with agent, local model and simulator; cloud with API, CI and Play">
  <style>
    .bg { fill: none }
    .zone { fill: #f4f6f7; stroke: #b9bfbe; stroke-width: 1; rx: 14 }
    .zone-cloud { fill: #eef4f6; stroke: #b9bfbe; stroke-width: 1; rx: 14 }
    .zone-label { font: 600 12px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #767f84; letter-spacing: .08em; text-transform: uppercase }
    .box { fill: #ffffff; stroke: #b9bfbe; stroke-width: 1.5; rx: 10 }
    .box-accent { fill: #dcecef; stroke: #0b6f80; stroke-width: 1.5; rx: 10 }
    .box-local { fill: #dbeee4; stroke: #1f6b45; stroke-width: 1.5; rx: 10 }
    .t { font: 600 14px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #191c1e; text-anchor: middle }
    .s { font: 400 11.5px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #4a5155; text-anchor: middle }
    .edge { stroke: #767f84; stroke-width: 1.6; fill: none; marker-end: url(#a) }
    .edge-strong { stroke: #0b6f80; stroke-width: 2; fill: none; marker-end: url(#ac) }
    .lbl { font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #767f84; text-anchor: middle }
    @media (prefers-color-scheme: dark) {
      .zone { fill: #1b2023; stroke: #3e474a }
      .zone-cloud { fill: #16303f; stroke: #3e474a }
      .zone-label { fill: #7c8688 }
      .box { fill: #14181a; stroke: #3e474a }
      .box-accent { fill: #17383e; stroke: #4fc3d6 }
      .box-local { fill: #163326; stroke: #7fc79f }
      .t { fill: #e8ecec }
      .s { fill: #a8b2b4 }
      .edge { stroke: #7c8688 }
      .edge-strong { stroke: #4fc3d6 }
      .lbl { fill: #7c8688 }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#767f84"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0b6f80"/>
    </marker>
  </defs>

  <rect class="zone" x="20" y="70" width="470" height="360"/>
  <text class="zone-label" x="38" y="94">Your machine</text>

  <rect class="zone-cloud" x="530" y="70" width="330" height="360"/>
  <text class="zone-label" x="548" y="94">Cloud</text>

  <rect class="box" x="40" y="16" width="150" height="40"/>
  <text class="t" x="115" y="41">Developer</text>

  <rect class="box-accent" x="60" y="115" width="200" height="56"/>
  <text class="t" x="160" y="139">Claude Code</text>
  <text class="s" x="160" y="157">Opus 5 · orchestrates</text>

  <rect class="box-local" x="40" y="225" width="200" height="56"/>
  <text class="t" x="140" y="249">LM Studio</text>
  <text class="s" x="140" y="267">localhost:1234</text>

  <rect class="box" x="40" y="315" width="200" height="52"/>
  <text class="t" x="140" y="339">Qwen3.8 27B</text>
  <text class="s" x="140" y="356">Q4_K_M · 16.8 GB</text>

  <rect class="box" x="290" y="225" width="180" height="56"/>
  <text class="t" x="380" y="249">iOS Simulator</text>
  <text class="s" x="380" y="267">launch · tap · shot</text>

  <rect class="box" x="290" y="120" width="180" height="48"/>
  <text class="t" x="380" y="149">Repository</text>

  <rect class="box-accent" x="570" y="115" width="250" height="48"/>
  <text class="t" x="695" y="144">Anthropic API</text>

  <rect class="box" x="570" y="225" width="250" height="56"/>
  <text class="t" x="695" y="249">GitHub Actions</text>
  <text class="s" x="695" y="267">build · sign · upload</text>

  <rect class="box" x="570" y="330" width="250" height="56"/>
  <text class="t" x="695" y="354">Google Play</text>
  <text class="s" x="695" y="372">Internal testing</text>

  <path class="edge" d="M115 58 L 140 110"/>
  <text class="lbl" x="88" y="92">intent</text>

  <path class="edge-strong" d="M260 139 L 565 139"/>
  <text class="lbl" x="412" y="131">reasoning</text>

  <path class="edge" d="M140 173 L 140 221"/>
  <text class="lbl" x="196" y="200">bulk, private</text>

  <path class="edge" d="M140 283 L 140 311"/>

  <path class="edge" d="M232 155 L 288 145"/>
  <text class="lbl" x="262" y="175">edits</text>

  <path class="edge" d="M215 160 L 300 221"/>
  <text class="lbl" x="300" y="205">drives</text>

  <path class="edge" d="M470 150 L 640 221"/>
  <text class="lbl" x="556" y="180">push release/**</text>

  <path class="edge" d="M695 283 L 695 326"/>
  <text class="lbl" x="695" y="308">signed AAB</text>
</svg>
