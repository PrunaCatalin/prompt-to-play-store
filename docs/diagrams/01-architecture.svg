<svg viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture: the developer talks to Claude Code, which reasons against the cloud API, calls a local model served by LM Studio, edits the repository and drives the iOS Simulator. Pushes to release branches reach GitHub Actions, which uploads a signed bundle to Play internal testing.">
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="pc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/></marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
    <rect x="16" y="66" width="470" height="352" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="34" y="90" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.2">YOUR MACHINE</text>

    <rect x="526" y="66" width="336" height="352" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="544" y="90" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.2">CLOUD</text>

    <rect x="40" y="14" width="150" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="115" y="39" text-anchor="middle" font-weight="700" fill="#0f172a">Developer</text>

    <rect x="56" y="110" width="206" height="58" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="159" y="134" text-anchor="middle" font-weight="700" fill="#0f172a">Claude Code</text>
    <text x="159" y="152" text-anchor="middle" font-size="11" fill="#475569">Opus 5 · orchestrates</text>

    <rect x="36" y="220" width="206" height="58" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="139" y="244" text-anchor="middle" font-weight="700" fill="#0f172a">LM Studio</text>
    <text x="139" y="262" text-anchor="middle" font-size="11" fill="#475569">localhost:1234</text>

    <rect x="36" y="310" width="206" height="54" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="139" y="333" text-anchor="middle" font-weight="700" fill="#0f172a">Qwen3.8 27B</text>
    <text x="139" y="351" text-anchor="middle" font-size="11" fill="#475569">Q4_K_M · 16.8 GB</text>

    <rect x="292" y="220" width="178" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="381" y="244" text-anchor="middle" font-weight="700" fill="#0f172a">iOS Simulator</text>
    <text x="381" y="262" text-anchor="middle" font-size="11" fill="#475569">launch · tap · shot</text>

    <rect x="292" y="116" width="178" height="48" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="381" y="145" text-anchor="middle" font-weight="700" fill="#0f172a">Repository</text>

    <rect x="566" y="110" width="256" height="48" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="694" y="139" text-anchor="middle" font-weight="700" fill="#0f172a">Anthropic API</text>

    <rect x="566" y="220" width="256" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="694" y="244" text-anchor="middle" font-weight="700" fill="#0f172a">GitHub Actions</text>
    <text x="694" y="262" text-anchor="middle" font-size="11" fill="#475569">build · sign · upload</text>

    <rect x="566" y="324" width="256" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="694" y="348" text-anchor="middle" font-weight="700" fill="#0f172a">Google Play</text>
    <text x="694" y="366" text-anchor="middle" font-size="11" fill="#475569">Internal testing</text>

    <line x1="112" y1="56" x2="140" y2="104" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pa)"/>
    <text x="80" y="92" font-size="10.5" fill="#64748b">intent</text>

    <line x1="264" y1="134" x2="560" y2="134" stroke="#0891b2" stroke-width="2" marker-end="url(#pc)"/>
    <text x="412" y="126" font-size="10.5" text-anchor="middle" fill="#0891b2">reasoning</text>

    <line x1="139" y1="170" x2="139" y2="214" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pa)"/>
    <text x="200" y="196" font-size="10.5" fill="#64748b">bulk · private</text>

    <line x1="139" y1="280" x2="139" y2="304" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pa)"/>

    <line x1="264" y1="146" x2="286" y2="142" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pa)"/>
    <text x="268" y="176" font-size="10.5" fill="#64748b">edits</text>

    <line x1="214" y1="170" x2="296" y2="214" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pa)"/>
    <text x="292" y="205" font-size="10.5" fill="#64748b">drives</text>

    <line x1="470" y1="150" x2="560" y2="216" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pa)"/>
    <text x="536" y="176" font-size="10.5" text-anchor="middle" fill="#64748b">push release/**</text>

    <line x1="694" y1="280" x2="694" y2="318" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pa)"/>
    <text x="694" y="304" font-size="10.5" text-anchor="middle" fill="#64748b">signed AAB</text>
  </g>
</svg>
